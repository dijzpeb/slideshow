# GitHub Pages への公開（リポジトリの Settings → Pages → Source を「GitHub Actions」にしてください）
#
# 公開するサイトの config.js は、リポジトリ変数（Settings → Secrets and variables → Actions → Variables）から
# scripts/write-config.mjs が作ります: SLIDESHOW_CLIENT_ID, SLIDESHOW_API_KEY, SLIDESHOW_FOLDER,
# SLIDESHOW_TITLE, SLIDESHOW_TIME_ZONE（どれも任意。一つも設定されていなければリポジトリの config.js をそのまま使う）。
#
# アクションはタグではなくコミットの SHA で固定しています（右のコメントがそのタグ）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りのみ。Pages への書き込みは deploy ジョブだけに与える
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Collect site files
        env:
          SLIDESHOW_CLIENT_ID: ${{ vars.SLIDESHOW_CLIENT_ID }}
          SLIDESHOW_API_KEY: ${{ vars.SLIDESHOW_API_KEY }}
          SLIDESHOW_FOLDER: ${{ vars.SLIDESHOW_FOLDER }}
          SLIDESHOW_TITLE: ${{ vars.SLIDESHOW_TITLE }}
          SLIDESHOW_TIME_ZONE: ${{ vars.SLIDESHOW_TIME_ZONE }}
        run: |
          mkdir -p _site
          cp -r index.html sw.js css js icons _site/
          node scripts/write-config.mjs _site/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
